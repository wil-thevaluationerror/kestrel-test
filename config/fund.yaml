# Defects are applied as named transforms on top of clean data. Setting `enabled: false`
# regenerates the clean file byte-for-byte, which is what makes the false-positive test honest.
# D03, D05, D06, D09 are specified in docs/SPEC.md but deferred to v1.1 with their rules.
defects:
  - id: D01
    enabled: true
    description: "Cap table ownership sums to 97.4% instead of 100%"
    holding_id: GV-A
    period: 2026Q2
    expected_rule: R04
  - id: D02
    enabled: true
    description: "'Total Revenue' renamed 'Net Sales' in the source template"
    holding_id: GE-B
    period: 2026Q2
    expected_rule: I01
  - id: D04
